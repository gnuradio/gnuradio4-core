additional_commands:
  foo:
    flags:
      - BAR
      - BAZ
    kwargs:
      DEPENDS: "*"
      HEADERS: "*"
      SOURCES: "*"
  gr_install_artifact:
    flags:
      - USE_SOURCE_PERMISSIONS
      - EXCLUDE
      - FILES_MATCHING
    kwargs:
      TARGETS: "*"
      FILES: "*"
      PROGRAMS: "*"
      DIRECTORY: "*"
      EXPORT: 1
      FILE: 1
      NAMESPACE: 1
      DESTINATION: 1
      COMPONENT: 1
      HEADERS_COMPONENT: 1
      ARCHIVE_COMPONENT: 1
      PATTERN: 1
  gr_install_runtime_dependencies:
    kwargs:
      SET: 1
      DESTINATION: 1
      COMPONENT: 1
bullet_char: "*"
dangle_parens: false
disabled_codes:
  - C0103
  - C0111
  - C0301
  - E1126
  - R0915
enum_char: .
line_ending: unix
line_width: 120
max_pargs_hwrap: 3
separate_ctrl_name_with_space: false
separate_fn_name_with_space: false
tab_size: 2
