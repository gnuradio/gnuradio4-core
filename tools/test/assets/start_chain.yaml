# The graph the start cases run. It holds a source, two blocks that each open the resource they name when they start,
# and a sink. `first` forwards its sample rate as a gr:sample_rate tag, and `second`, which couples its sample rate to
# that key, takes it from the stream.
blocks:
  - id: good::fixed_source<float32>
    parameters:
      name: source
  - id: good::start_recorder<float32>
    parameters:
      name: first
      resource: named-in-the-graph-file
      sample_rate: !!float32 1000
  - id: good::start_recorder<float32>
    parameters:
      name: second
      resource: named-in-the-graph-file
    tag_couplings:
      sample_rate: "gr:sample_rate"
  - id: good::cout_sink<float32>
    parameters:
      name: sink
connections:
  - [source, out, first, in]
  - [first, out, second, in]
  - [second, out, sink, in]
