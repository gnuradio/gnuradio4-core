# The graph the fusion cases run: a source, two 1:1 blocks between it and the sink, and a sink. The two middle blocks
# are the one chain a fused run can take; the source has no input and the sink no output, so neither joins it. Neither
# end asks to stop, so a run of this graph ends on the --seconds bound.
blocks:
  - id: good::fixed_source<float32>
    parameters:
      name: source
  - id: good::identity<float32>
    parameters:
      name: first
  - id: good::identity<float32>
    parameters:
      name: second
  - id: good::cout_sink<float32>
    parameters:
      name: sink
connections:
  - [source, out, first, in]
  - [first, out, second, in]
  - [second, out, sink, in]
